name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  template:
    name: template (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is not available on ubuntu-latest (26.04); pin the LTS image.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved). Dependabot keeps them current.
      # Node 24-native majors: GitHub removed Node 20 from runners on 2026-09-23.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and every tag: the upgrade test generates a project at the previous release tag
          # (git archive v0.2.0) and updates it. A shallow clone has no tag, so that test would skip.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  # One stable check for the ruleset to require: it changes only when this job does, not when the matrix does.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [template]
    runs-on: ubuntu-latest   # copy the runner the 3.13 leg uses; PR-C pins it
    timeout-minutes: 5
    steps:
      - name: Every matrix job must succeed
        env:
          RESULT: ${{ needs.template.result }}
        run: test "$RESULT" = "success"
