name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  template:
    name: template (${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.14"
            experimental: false
          # Informational until it has been green for two weeks; continue-on-error keeps a failure out of ci-gate.
          - python-version: "3.15"
            experimental: true
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved). Dependabot keeps them current.
      # Node 24-native majors: GitHub removed Node 20 from runners on 2026-09-23.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and every tag: the upgrade test generates a project at the previous release tag
          # (git archive v0.2.0) and updates it. A shallow clone has no tag, so that test would skip.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  # One stable check for the ruleset to require: it changes only when this job does, not when the matrix does.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [template]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every matrix job must succeed
        env:
          RESULT: ${{ needs.template.result }}
        run: test "$RESULT" = "success"
