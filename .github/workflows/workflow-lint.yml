name: workflow-lint

# Lints this repository's workflows: syntax and shell mistakes (actionlint), injection, excess permissions and
# unpinned actions (zizmor). The same job ships to generated projects in template/.github/workflows/check.yml.
# It lints the shipped workflows (template/.github) too: the root tests that do so skip when the linters are absent.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lints the workflows themselves: syntax and shell mistakes (actionlint), injection, excess permissions and
  # unpinned actions (zizmor). Both linters are pinned; bump them by hand, Dependabot does not see the tarball.
  workflow-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # zizmor's online audits; only needed in a private repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml template/.github/workflows/*.yml
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: . template/.github # the default (.) audits only this repo's own files, not the workflows it ships
          advanced-security: false # the default uploads SARIF and needs security-events: write
          version: 1.32.0
