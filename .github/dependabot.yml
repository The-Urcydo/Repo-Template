# Keeps the SHA-pinned actions in .github/workflows/ and the dev tools in requirements-dev.txt current.
# Actions: one grouped pull request a week.
# pip: requirements-dev.txt has `>=` floors and CI still runs Python 3.9. By default Dependabot raises a
# floor to every new release even when the range already allows it, and the newest pytest and copier no
# longer install on 3.9. `increase-if-necessary` leaves a floor alone unless the new version needs it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
