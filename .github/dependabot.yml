# Keeps the SHA-pinned actions in .github/workflows/ and the dev tools in requirements-dev.txt current.
# Actions: one grouped pull request a week. Every ecosystem has a cooldown: a release younger than 7 days is
# not proposed, which is when most hijacked releases get caught.
# pip: requirements-dev.txt has `>=` floors and CI runs Python 3.12 and 3.14. By default Dependabot
# raises a floor to every new release even when the range already allows it; `increase-if-necessary`
# leaves a floor alone unless the new version needs it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
