<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Repo-Template social card · A · Sharper tree</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* A · Sharper tree: the card from PR #28, same dark brand and layout, with the weak parts fixed.
     1280x640. Safe zone 1120x520 (80px sides, 60px top and bottom). Smallest text 22px. */
  :root {
    --bg-1: #0d1117;
    --bg-2: #16202e;
    --panel: #0a0f16;
    --line: #2f4257;
    --teal: #3fb9a8;
    --text: #f0f6fc;
    --text-2: #c9d6e2;
    --text-3: #9fb3c8;
    --glyph: #7f93a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg-1); }
  .card {
    position: relative; width: 1280px; height: 640px;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    font-family: "RT Sans", sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .bar { position: absolute; left: 0; top: 0; width: 12px; height: 640px; background: var(--teal); }

  .left { position: absolute; left: 88px; top: 0; width: 600px; height: 640px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-family: "RT Display", sans-serif; font-weight: 800; font-size: 80px; line-height: 1; letter-spacing: -0.025em; }
  .what { margin-top: 26px; font-weight: 500; font-size: 34px; line-height: 1.25; color: var(--text-2); }
  .hook { margin-top: 30px; font-weight: 600; font-size: 26px; color: var(--teal); }

  .panel {
    position: absolute; left: 704px; top: 90px; width: 496px; height: 460px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    padding: 28px 30px; font-family: "RT Mono", monospace;
  }
  .root { height: 52px; font-size: 28px; font-weight: 700; color: var(--text); line-height: 52px; }
  .row { display: grid; grid-template-columns: 196px 1fr; align-items: baseline; height: 54px; line-height: 54px; }
  .name { font-size: 28px; font-weight: 700; color: var(--teal); white-space: pre; }
  .name i { font-style: normal; font-weight: 400; color: var(--glyph); }
  .desc { font-family: "RT Sans", sans-serif; font-weight: 500; font-size: 22px; color: var(--text-3); white-space: nowrap; }
  .rule { height: 2px; background: var(--line); margin: 14px 0 10px; }
  .proof { display: flex; align-items: center; justify-content: space-between; height: 54px; font-size: 22px; color: var(--text-2); white-space: nowrap; }
  .proof b { color: var(--teal); font-weight: 700; }
  .ok { font-size: 26px; font-weight: 700; color: var(--teal); background: rgba(63,185,168,.16); border: 2px solid rgba(63,185,168,.55); border-radius: 12px; padding: 0 14px; line-height: 40px; }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="left">
    <h1>Repo-Template</h1>
    <p class="what">A Copier template for<br>agent-ready repositories</p>
    <p class="hook">One human. Several AI agents. One structure.</p>
  </div>
  <div class="panel">
    <div class="root">my-app/</div>
    <div class="row"><span class="name"><i>├─ </i>docs/</span><span class="desc">what is true</span></div>
    <div class="row"><span class="name"><i>├─ </i>work/</span><span class="desc">what is happening</span></div>
    <div class="row"><span class="name"><i>├─ </i>agents/</span><span class="desc">how work gets done</span></div>
    <div class="row"><span class="name"><i>├─ </i>tools/</span><span class="desc">keeps it honest</span></div>
    <div class="row"><span class="name"><i>└─ </i>src/</span><span class="desc">your code</span></div>
    <div class="rule"></div>
    <div class="proof"><span><b>$</b> python3 tools/check.py</span><span class="ok">ok</span></div>
  </div>
</div>
</body>
</html>
