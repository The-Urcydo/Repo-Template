name: template-update

# Weekly: is a newer release of the template this repo came from available? If so, open ONE issue.
# It never opens a pull request and never changes a file: updating is `copier update --trust`, run by a person
# or an agent on a clean repo (docs/dev/how-to/update-from-template.md). A source it cannot reach (a private or
# local template) only writes a line to this run's log. GitHub pauses scheduled workflows after 60 days
# without repository activity; run it by hand from the Actions tab (workflow_dispatch) to wake it.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC, off the top of the hour when schedules queue up
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-update
  cancel-in-progress: false

jobs:
  notify:
    name: Check for a newer template release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the only write this workflow does: one issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with the latest template release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          message=$(python3 tools/template_status.py --check)
          rc=$?
          set -e
          echo "$message"
          [ "$rc" -eq 1 ] || exit "$rc"
          latest=$(printf '%s' "$message" | sed -n 's/^behind: \(v[0-9]*\.[0-9]*\.[0-9]*\) available.*/\1/p')
          [ -n "$latest" ] || { echo "could not read the version from: $message"; exit 1; }
          title="Update from the template: ${latest} is available"
          gh label create template-update --description "A newer template release is available" --color 0E8A16 2>/dev/null || true
          open=$(gh issue list --label template-update --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "an open issue already exists; not opening another"
            exit 0
          fi
          gh issue create --label template-update --title "$title" --body "$message

          Steps: clean working tree, then \`copier update --trust\`, resolve conflicts, then \`python3 tools/check.py --strict\`. Read the template's release notes first: a release that moves files ships a migration. Full guide: docs/dev/how-to/update-from-template.md.

          Opened by .github/workflows/template-update.yml. Close this issue when the update is merged."
