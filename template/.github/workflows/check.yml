name: check

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved). Dependabot keeps them current.
      # Node 24-native majors: GitHub removed Node 20 from runners on 2026-09-23.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Repo health check (warnings fail too)
        run: python3 tools/check.py --strict
      - name: Tooling unit tests
        run: python3 -m unittest discover -s tools/tests
