name: check

on:
  push:
    branches: [main]
  pull_request:
  merge_group: # runs the check in a merge queue too, if you turn one on

# Least privilege: nothing in this workflow writes to the repo.
permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main and in a merge queue always finish.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the job id `check`: it is the status a repository ruleset requires (docs/dev/how-to/protect-the-repo.md).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved). Dependabot keeps them current.
      # Node 24-native majors: GitHub removed Node 20 from runners on 2026-09-23.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Repo health check (warnings fail too)
        run: python3 tools/check.py --strict
      - name: Tooling unit tests
        run: python3 -m unittest discover -s tools/tests

  # Lints the workflows themselves: syntax and shell mistakes (actionlint), injection, excess permissions and
  # unpinned actions (zizmor). Both linters are pinned; bump them by hand, Dependabot does not see the tarball.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # zizmor's online audits; only needed in a private repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false # the default uploads SARIF and needs security-events: write
          version: 1.32.0
