[pytest]
# Only this repository's tests. Without it, `pytest` also collects root-level tool-tests (the suite a
# generated project runs), imports it into this tree and writes __pycache__ here, which
# test_template_has_no_stray_artifacts then reports. The root suite copies tool-tests into a generated
# project before running them; do not point testpaths at tool-tests.
testpaths = tests
# The suite is subprocess-heavy and its tests differ a lot in duration (a Copier update vs a file
# read), so distribute with worksteal. Cap the workers: xdist otherwise starts one per logical CPU,
# and on a many-core machine the extra processes only add I/O contention.
addopts = -n auto --maxprocesses 8 --dist worksteal
